<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Catalog Dashboard</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header>
        <h1>Product Catalog Dashboard</h1>
    </header>

    <section class="controls">
        <button id="showAll">All Products</button>
        <button id="electronicsBtn">Electronics</button>
        <button id="under100Btn">Under $100</button>
    </section>

    <main>
        <section>
            <h2>Products</h2>
            <div id="productContainer"></div>
        </section>

        <section>
            <h2>Product Names</h2>
            <ul id="productNames"></ul>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
